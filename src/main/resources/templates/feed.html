<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форум</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments :: header}"></header>

<h1>Лента</h1>

<p th:if="${publications.isEmpty()}">Публикаций пока нет</p>

<div th:each="publication : ${publications}">
    <h2>
        <a th:href="@{/publications/{id}(id=${publication.id})}" th:text="${publication.title}">Заголовок</a>
    </h2>
    <p class="meta">
        <span th:text="${publication.author.username}">автор</span>,
        <span th:text="${#temporals.format(publication.createdAt, 'dd.MM.yyyy HH:mm')}">дата</span>
    </p>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Публикация</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments :: header}"></header>

<h1 th:text="${publicationId == null} ? 'Новая публикация' : 'Редактирование публикации'">Публикация</h1>

<form th:action="${publicationId == null} ? @{/publications} : @{/publications/{id}/edit(id=${publicationId})}"
      th:object="${publicationForm}" method="post">
    <p>
        <label>Заголовок<br>
            <input type="text" th:field="*{title}" maxlength="255" required>
        </label>
    </p>
    <p>
        <label>Текст<br>
            <textarea th:field="*{content}" rows="10" required></textarea>
        </label>
    </p>
    <button type="submit">Сохранить</button>
</form>
</body>
</html>
